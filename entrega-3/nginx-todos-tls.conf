server {
    listen 80;
    server_name equipo.arqweb.test 192.168.56.101;
    return 301 https://equipo.arqweb.test$request_uri;
}

server {
    listen 443 ssl;
    server_name equipo.arqweb.test;

    ssl_certificate     /etc/ssl/certs/arqweb.crt;
    ssl_certificate_key /etc/ssl/private/arqweb.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}